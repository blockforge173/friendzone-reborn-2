<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Friendzoné Reborn, une histoire interactive dont vous êtes le héros."
    >

    <title>
        Friendzoné Reborn
    </title>


    <!--=================================================
     FEUILLES DE STYLE
    ==================================================-->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/dialogue.css"
    >

    <link
        rel="stylesheet"
        href="css/choix.css"
    >

    <link
        rel="stylesheet"
        href="css/animations.css"
    >

</head>


<body>

    <!--=================================================
     FOND DYNAMIQUE DU JEU
    ==================================================-->

    <div
        id="fond-jeu"
        aria-hidden="true"
    ></div>


    <!--=================================================
     VOILE SOMBRE
    ==================================================-->

    <div
        id="voile-fond"
        aria-hidden="true"
    ></div>


    <!--=================================================
     TRANSITION NOIRE
    ==================================================-->

    <div
        id="transition"
        class="actif"
        aria-hidden="true"
    ></div>


    <!--=================================================
     CONTENEUR PRINCIPAL
    ==================================================-->

    <div id="jeu">


        <!--=============================================
         ENTÊTE
        ==============================================-->

        <header id="entete">

            <button
                id="retourMenu"
                type="button"
                aria-label="Retourner au menu principal"
            >
                ← Menu
            </button>


            <div
                id="titre"
                role="heading"
                aria-level="1"
            >
                Chargement du chapitre...
            </div>


            <button
                id="ouvrirParametres"
                type="button"
                aria-label="Ouvrir les paramètres"
                aria-controls="popupParametres"
                aria-expanded="false"
            >
                ⚙
            </button>

        </header>


        <!--=============================================
         CONVERSATION
        ==============================================-->

        <main
            id="conversation"
            aria-live="polite"
            aria-relevant="additions"
        >

            <div id="texte">

                <!--
                    Les messages sont ajoutés
                    automatiquement par dialogue.js.
                -->

            </div>

        </main>


        <!--=============================================
         POPUP DES CHOIX
        ==============================================-->

        <div
            id="popupChoix"
            class="popup-choix"
            aria-hidden="true"
        >

            <div
                class="popup-choix-contenu"
                role="dialog"
                aria-modal="true"
                aria-labelledby="titreChoix"
            >

                <h2 id="titreChoix">
                    Que veux-tu faire ?
                </h2>


                <div id="choix">

                    <!--
                        Les boutons sont ajoutés
                        automatiquement par choix.js.
                    -->

                </div>

            </div>

        </div>


        <!--=============================================
         POPUP DES PARAMÈTRES
        ==============================================-->

        <div
            id="popupParametres"
            class="popup-parametres"
            aria-hidden="true"
        >

            <div
                class="popup-parametres-contenu"
                role="dialog"
                aria-modal="true"
                aria-labelledby="titreParametres"
            >

                <h2 id="titreParametres">
                    Paramètres
                </h2>


                <!--=====================================
                 AUDIO
                ======================================-->

                <h3>
                    Audio
                </h3>


                <!--=====================================
                 MUSIQUE
                ======================================-->

                <div class="groupe-parametre">

                    <label for="volumeMusique">
                        Volume de la musique
                    </label>


                    <input
                        id="volumeMusique"
                        type="range"
                        min="0"
                        max="100"
                        step="1"
                        value="40"
                        aria-label="Volume de la musique"
                    >


                    <output
                        id="valeurVolumeMusique"
                        for="volumeMusique"
                    >
                        40 %
                    </output>

                </div>


                <!--=====================================
                 AMBIANCE
                ======================================-->

                <div class="groupe-parametre">

                    <label for="volumeAmbiance">
                        Volume de l'ambiance
                    </label>


                    <input
                        id="volumeAmbiance"
                        type="range"
                        min="0"
                        max="100"
                        step="1"
                        value="25"
                        aria-label="Volume de l'ambiance"
                    >


                    <output
                        id="valeurVolumeAmbiance"
                        for="volumeAmbiance"
                    >
                        25 %
                    </output>

                </div>


                <!--=====================================
                 EFFETS
                ======================================-->

                <div class="groupe-parametre">

                    <label for="volumeEffets">
                        Volume des effets
                    </label>


                    <input
                        id="volumeEffets"
                        type="range"
                        min="0"
                        max="100"
                        step="1"
                        value="70"
                        aria-label="Volume des effets sonores"
                    >


                    <output
                        id="valeurVolumeEffets"
                        for="volumeEffets"
                    >
                        70 %
                    </output>

                </div>


                <!--=====================================
                 AFFICHAGE
                ======================================-->

                <h3>
                    Affichage
                </h3>


                <!--=====================================
                 ASSOMBRISSEMENT
                ======================================-->

                <div class="groupe-parametre">

                    <label for="assombrissementFond">
                        Assombrissement du fond
                    </label>


                    <input
                        id="assombrissementFond"
                        type="range"
                        min="0"
                        max="100"
                        step="1"
                        value="35"
                        aria-label="Assombrissement du fond"
                    >


                    <output
                        id="valeurAssombrissementFond"
                        for="assombrissementFond"
                    >
                        35 %
                    </output>

                </div>


                <!--=====================================
                 INFORMATION
                ======================================-->

                <p>
                    Les paramètres sont sauvegardés automatiquement.
                </p>


                <!--=====================================
                 RÉINITIALISER
                ======================================-->

                <button
                    id="reinitialiserParametres"
                    type="button"
                >
                    Réinitialiser
                </button>


                <!--=====================================
                 FERMER
                ======================================-->

                <button
                    id="fermerParametres"
                    type="button"
                >
                    Fermer
                </button>

            </div>

        </div>

    </div>


    <!--=================================================
     SCRIPTS

     ORDRE IMPORTANT :

     audioManager
         ↓
     parametresManager
         ↓
     animationManager
         ↓
     sauvegardeManager
         ↓
     chapitresManager
         ↓
     conditions
         ↓
     dialogueManager
         ↓
     choixManager
         ↓
     succesManager
         ↓
     galerieManager
         ↓
     moteur
    ==================================================-->

    <script src="js/audioManager.js"></script>

    <script src="js/parametres.js"></script>

    <script src="js/animation.js"></script>

    <script src="js/sauvegarde.js"></script>

    <script src="js/chapitres.js"></script>

    <script src="js/conditions.js"></script>

    <script src="js/dialogue.js"></script>

    <script src="js/choix.js"></script>

    <script src="js/succes.js"></script>

    <script src="js/galerie.js"></script>

    <script src="js/moteur.js"></script>


    <!--=================================================
     INTERFACE DU JEU

     Ce script gère uniquement :
     - retour au menu ;
     - ouverture des paramètres ;
     - fermeture des paramètres.

     Les paramètres eux-mêmes sont gérés
     par parametres.js.
    ==================================================-->

    <script>

        "use strict";


        /*=================================================
         ÉLÉMENTS
        =================================================*/

        const boutonRetourMenu =
            document.getElementById(
                "retourMenu"
            );


        const boutonOuvrirParametres =
            document.getElementById(
                "ouvrirParametres"
            );


        const boutonFermerParametres =
            document.getElementById(
                "fermerParametres"
            );


        const popupParametres =
            document.getElementById(
                "popupParametres"
            );


        /*=================================================
         OUVRIR LES PARAMÈTRES
        =================================================*/

        function ouvrirParametres() {

            if (
                !popupParametres
            ) {

                return;

            }


            /*---------------------------------------------
             SYNCHRONISATION AVANT AFFICHAGE
            ---------------------------------------------*/

            if (
                typeof parametresManager !==
                    "undefined" &&
                parametresManager !==
                    null &&
                typeof parametresManager
                    .actualiserDepuisAudio ===
                    "function"
            ) {

                parametresManager
                    .actualiserDepuisAudio();

            }


            popupParametres
                .classList
                .add(
                    "ouverte"
                );


            popupParametres
                .setAttribute(
                    "aria-hidden",
                    "false"
                );


            if (
                boutonOuvrirParametres
            ) {

                boutonOuvrirParametres
                    .setAttribute(
                        "aria-expanded",
                        "true"
                    );

            }


            if (
                boutonFermerParametres
            ) {

                boutonFermerParametres
                    .focus();

            }

        }


        /*=================================================
         FERMER LES PARAMÈTRES
        =================================================*/

        function fermerParametres() {

            if (
                !popupParametres
            ) {

                return;

            }


            popupParametres
                .classList
                .remove(
                    "ouverte"
                );


            popupParametres
                .setAttribute(
                    "aria-hidden",
                    "true"
                );


            if (
                boutonOuvrirParametres
            ) {

                boutonOuvrirParametres
                    .setAttribute(
                        "aria-expanded",
                        "false"
                    );


                boutonOuvrirParametres
                    .focus();

            }

        }


        /*=================================================
         RETOUR AU MENU
        =================================================*/

        if (
            boutonRetourMenu
        ) {

            boutonRetourMenu
                .addEventListener(
                    "click",
                    () => {

                        const confirmation =
                            window.confirm(
                                "Retourner au menu principal ?"
                            );


                        if (
                            !confirmation
                        ) {

                            return;

                        }


                        /*---------------------------------
                         SAUVEGARDE
                        ---------------------------------*/

                        if (
                            typeof moteur !==
                                "undefined" &&
                            moteur !==
                                null &&
                            typeof moteur
                                .sauvegarder ===
                                "function"
                        ) {

                            moteur
                                .sauvegarder();

                        }


                        /*---------------------------------
                         FERMER ÉVENTUELLEMENT UN MÉDIA
                         DE GALERIE

                         Normalement la visionneuse est
                         uniquement utilisée dans index.html,
                         mais cette sécurité permet à
                         galerie.js de rester réutilisable.
                        ---------------------------------*/

                        if (
                            typeof galerieManager !==
                                "undefined" &&
                            galerieManager !==
                                null &&
                            typeof galerieManager
                                .fermerVisionneuse ===
                                "function"
                        ) {

                            galerieManager
                                .fermerVisionneuse();

                        }


                        /*---------------------------------
                         AUDIO
                        ---------------------------------*/

                        if (
                            typeof audioManager !==
                                "undefined" &&
                            audioManager !==
                                null
                        ) {

                            if (
                                typeof audioManager
                                    .fadeOut ===
                                    "function"
                            ) {

                                audioManager
                                    .fadeOut(
                                        800
                                    );

                            }


                            if (
                                typeof audioManager
                                    .fadeOutAmbiance ===
                                    "function"
                            ) {

                                audioManager
                                    .fadeOutAmbiance(
                                        600
                                    );

                            }
                            else if (
                                typeof audioManager
                                    .arreterAmbiance ===
                                    "function"
                            ) {

                                audioManager
                                    .arreterAmbiance();

                            }

                        }


                        /*---------------------------------
                         REDIRECTION
                        ---------------------------------*/

                        const allerAuMenu =
                            () => {

                                window.location.href =
                                    "index.html";

                            };


                        /*---------------------------------
                         TRANSITION
                        ---------------------------------*/

                        if (
                            typeof animationManager !==
                                "undefined" &&
                            animationManager !==
                                null &&
                            typeof animationManager
                                .transitionVersNoir ===
                                "function"
                        ) {

                            animationManager
                                .transitionVersNoir(
                                    allerAuMenu
                                );


                            return;

                        }


                        /*---------------------------------
                         SECOURS
                        ---------------------------------*/

                        allerAuMenu();

                    }
                );

        }


        /*=================================================
         OUVERTURE DES PARAMÈTRES
        =================================================*/

        if (
            boutonOuvrirParametres
        ) {

            boutonOuvrirParametres
                .addEventListener(
                    "click",
                    ouvrirParametres
                );

        }


        /*=================================================
         FERMETURE DES PARAMÈTRES
        =================================================*/

        if (
            boutonFermerParametres
        ) {

            boutonFermerParametres
                .addEventListener(
                    "click",
                    fermerParametres
                );

        }


        /*=================================================
         CLIC SUR LE FOND
        =================================================*/

        if (
            popupParametres
        ) {

            popupParametres
                .addEventListener(
                    "click",
                    event => {

                        if (
                            event.target ===
                            popupParametres
                        ) {

                            fermerParametres();

                        }

                    }
                );

        }


        /*=================================================
         ÉCHAP
        =================================================*/

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key !==
                    "Escape"
                ) {

                    return;

                }


                if (
                    !popupParametres
                ) {

                    return;

                }


                if (
                    popupParametres
                        .classList
                        .contains(
                            "ouverte"
                        )
                ) {

                    fermerParametres();

                }

            }
        );

    </script>

</body>

</html>
